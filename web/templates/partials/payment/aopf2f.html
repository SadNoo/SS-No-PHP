{{define "partials/payment/aopf2f"}}<div class="card-inner">
    <div class="row">
        <div class="col-lg-6 col-md-6">
            <p class="card-heading">支付宝在线充值</p>
            <div class="form-group form-group-label">
                <label class="floating-label" for="amount">金额</label>
                <input class="form-control" id="amount" type="text">
            </div>
        </div>
        <div class="col-lg-6 col-md-6">
            <div class="h5 margin-top-sm text-black-hint" id="qrarea"></div>
        </div>
    </div>
</div>

<a class="btn btn-flat waves-attach" id="pay"><span class="icon">check</span>&nbsp;充值</a>

<script nonce="{{$.Nonce}}">
    $(function () {
        var pid = 0;
        var tid = 0;

        // 原版每次点击都会再绑定一次 shown 事件（重复下单），且查询到已支付后仍继续轮询。
        $("#pay").click(function () {
            clearTimeout(tid);
            $("#readytopay").one('shown.bs.modal', function () {
                $.ajax({
                    type: "POST",
                    url: "/user/payment/purchase",
                    dataType: "json",
                    data: {
                        amount: $$getValue('amount')
                    },
                    success: (data) => {
                        $("#readytopay").modal('hide');
                        if (data.ret) {
                            pid = data.pid;
                            $$.getElementById('qrarea').innerHTML = '<div class="text-center"><p>请使用手机支付宝扫描二维码支付</p><a id="qrcode" style="padding-top:10px;display:inline-block"></a><p>手机可点击二维码唤起支付宝支付</p></div>';
                            new QRCode("qrcode", {
                                render: "canvas",
                                width: 200,
                                height: 200,
                                text: encodeURI(data.qrcode)
                            });
                            $$.getElementById('qrcode').setAttribute('href', data.qrcode);
                            tid = setTimeout(f, 1000);
                        } else {
                            $("#result").modal();
                            $("#msg").text(data.msg);
                        }
                    },
                    error: (jqXHR) => {
                        $("#readytopay").modal('hide');
                        $("#result").modal();
                        $("#msg").text(`${jqXHR.status} 发生错误了`);
                    }
                });
            });
            $("#readytopay").modal();
        });

        function f() {
            $.ajax({
                type: "POST",
                url: "/payment/status",
                dataType: "json",
                data: {
                    pid: pid
                },
                success: (data) => {
                    if (data.result) {
                        $("#result").modal();
                        $("#msg").text('充值成功');
                        jumpTo(window.location.href, {{cfg "jump_delay"}});
                    } else {
                        tid = setTimeout(f, 1000);
                    }
                },
                error: () => {
                    tid = setTimeout(f, 3000);
                }
            });
        }
    });
</script>{{end}}
