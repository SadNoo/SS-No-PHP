{{define "page"}}{{template "partials/admin/main" $}}


<main class="content">
    <div class="content-header ui-content-header">
        <div class="container">
            <h1 class="content-heading"> 编辑规则 #{{$.Data.rule.ID}}</h1>
        </div>
    </div>
    <div class="container">
        <div class="col-lg-12 col-sm-12">
            <section class="content-inner margin-top-no">
                <form id="main_form">
                    <div class="card">
                        <div class="card-main">
                            <div class="card-inner">
                                <div class="form-group form-group-label">
                                    <label class="floating-label" for="name">规则名称</label>
                                    <input class="form-control maxwidth-edit" id="name" name="name" type="text"
                                           value="{{$.Data.rule.Name}}">
                                </div>


                                <div class="form-group form-group-label">
                                    <label class="floating-label" for="text">规则描述</label>
                                    <input class="form-control maxwidth-edit" id="text" name="text" type="text"
                                           value="{{$.Data.rule.Text}}">
                                </div>

                                <div class="form-group form-group-label">
                                    <label class="floating-label" for="regex">规则正则表达式</label>
                                    <input class="form-control maxwidth-edit" id="regex" name="regex" type="text"
                                           value="{{$.Data.rule.Regex}}">
                                </div>


                                <div class="form-group form-group-label">
                                    <div class="form-group form-group-label">
                                        <label class="floating-label" for="type">规则类型</label>
                                        <select id="type" class="form-control maxwidth-edit" name="type">
                                            <option value="1" {{if truthy (peq $.Data.rule.Type 1)}}selected{{end}}>数据包明文匹配</option>
                                            <option value="2" {{if truthy (peq $.Data.rule.Type 2)}}selected{{end}}>数据包 hex 匹配</option>
                                        </select>
                                    </div>
                                </div>


                            </div>
                        </div>
                    </div>


                    <div class="card">
                        <div class="card-main">
                            <div class="card-inner">

                                <div class="form-group">
                                    <div class="row">
                                        <div class="col-md-10 col-md-push-1">
                                            <button id="submit" type="submit"
                                                    class="btn btn-block btn-brand waves-attach waves-light">修改
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
                {{template "partials/dialog" $}}

        </div>


    </div>
</main>


{{template "partials/admin/footer" $}}


<script nonce="{{$.Nonce}}">
    $('#main_form').validate({
        
        rules: {
            name: {required: true},
            text: {required: true},
            regex: {required: true}
        },
        
        submitHandler: function () {

            $.ajax({
                type: "PUT",
                url: "/admin/detect/{{$.Data.rule.ID}}",
                dataType: "json",

                data: {
                    name: $$getValue("name"),
                    text: $$getValue("text"),
                    regex: $$getValue("regex"),
                    type: $$getValue("type")
                },
                success: data => {
                    if (data.ret) {
                        $("#result").modal();
                        $$.getElementById('msg').innerHTML = data.msg;
                        jumpTo(top.document.referrer, {{cfg "jump_delay"}});
                    } else {
                        $("#result").modal();
                        $$.getElementById('msg').innerHTML = data.msg;
                    }
                },
                error: jqXHR => {
                    $("#result").modal();
                    $$.getElementById('msg').innerHTML = `${data.msg} 发生错误了。`;
                }
            });
        }
    });

</script>{{end}}
