{{define "page"}}{{template "partials/admin/main" $}}


<main class="content">
    <div class="content-header ui-content-header">
        <div class="container">
            <h1 class="content-heading">商品列表</h1>
        </div>
    </div>
    <div class="container">
        <div class="col-lg-12 col-sm-12">
            <section class="content-inner margin-top-no">

                <div class="card">
                    <div class="card-main">
                        <div class="card-inner">
                            <p>系统中所有商品的列表。</p>
                            <p>显示表项:
                                {{template "partials/table/checkbox" $}}
                            </p>
                        </div>
                    </div>
                </div>

                <div class="table-responsive">
                    {{template "partials/table/table" $}}
                </div>

                <div class="fbtn-container">
                    <div class="fbtn-inner">
                        <a class="fbtn fbtn-lg fbtn-brand-accent waves-attach waves-circle waves-light"
                           href="/admin/shop/create">+</a>

                    </div>
                </div>

                <div aria-hidden="true" class="modal modal-va-middle fade" id="delete_modal" role="dialog"
                     tabindex="-1">
                    <div class="modal-dialog modal-xs">
                        <div class="modal-content">
                            <div class="modal-heading">
                                <a class="modal-close" data-dismiss="modal">×</a>
                                <h2 class="modal-title">确认要下架？</h2>
                            </div>
                            <div class="modal-inner">
                                <p>提示：下架会关闭所有购买过的此套餐的自动续费！</p>
                                <p>请您确认。</p>
                            </div>
                            <div class="modal-footer">
                                <p class="text-right">
                                    <button class="btn btn-flat btn-brand-accent waves-attach waves-effect"
                                            data-dismiss="modal" type="button">取消
                                    </button>
                                    <button class="btn btn-flat btn-brand-accent waves-attach" data-dismiss="modal"
                                            id="delete_input" type="button">确定
                                    </button>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                {{template "partials/dialog" $}}

        </div>


    </div>
</main>


{{template "partials/admin/footer" $}}

<script nonce="{{$.Nonce}}">

    function delete_modal_show(id) {
        deleteid = id;
        $("#delete_modal").modal();
    }

    {{template "partials/table/js_1" $}}

    var tableKeys = {{$.Data.table_config.Keys}};

    window.addEventListener('load', () => {
        table_1 = $('#table_1').DataTable({
            ajax: {
                url: {{$.Data.table_config.AjaxURL}},
                type: "POST"
            },
            processing: true,
            order: [[2, 'desc']],
            stateSave: true,
            columnDefs: [{
                targets: ['_all'],
                className: 'mdl-data-table__cell--non-numeric'
            }],
            columns: [
                ...tableKeys.map(function (k) { return {"data": k}; })
            ],
            {{template "partials/table/lang_chinese" $}}
        })


        var has_init = JSON.parse(localStorage.getItem(`${window.location.href}-hasinit`));
        if (has_init !== true) {
            localStorage.setItem(`${window.location.href}-hasinit`, true);
        } else {
            tableKeys.forEach(function (k) {
                var checked = JSON.parse(localStorage.getItem(window.location.href + '-haschecked-checkbox_' + k));
                $$.getElementById('checkbox_' + k).checked = checked == true;
            });
        }

        tableKeys.forEach(function (k) { modify_table_visible('checkbox_' + k, k); });


        function delete_id() {
            $.ajax({
                type: "DELETE",
                url: "/admin/shop",
                dataType: "json",
                data: {
                    id: deleteid
                },
                success: data => {
                    if (data.ret) {
                        $("#result").modal();
                        $$.getElementById('msg').innerHTML = data.msg;
                        $$.getElementById(`row_delete_${deleteid}`).setAttribute('disabled', 'true')
                    } else {
                        $("#result").modal();
                        $$.getElementById('msg').innerHTML = data.msg;
                    }
                },
                error: jqXHR => {
                    $("#result").modal();
                    $$.getElementById('msg').innerHTML = `${data.msg} 发生了错误。`;
                }
            });
        }

        $$.getElementById('delete_input').addEventListener('click', delete_id);
    })

</script>{{end}}
