version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - gosec          # 安全检查
    - bodyclose
    - errorlint
    - noctx
    - sqlclosecheck
    - rowserrcheck
    - misspell
    - unconvert
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]
formatters:
  enable:
    - gofmt
    - goimports
